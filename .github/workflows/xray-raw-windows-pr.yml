name: Xray raw Windows PR

on:
  pull_request:
    branches:
      - feature/xray-backend
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  windows-qt6-tests:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Qt 6.7
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: win64_msvc2019_64
          modules: qtsvg
          cache: true

      - name: Configure tests
        shell: pwsh
        run: >
          cmake -S . -B build/windows-qt6-pr -G Ninja
          -DBUILD_TESTING=ON
          -DQT_VERSION_MAJOR=6
          -DNKR_NO_EXTERNAL=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build Xray test targets
        shell: pwsh
        run: >
          cmake --build build/windows-qt6-pr
          --target fake_xray test_xray_core_runner test_xray_backend test_xray_profile_session test_xray_profile_guard
          --parallel 2

      - name: Run CTest
        shell: pwsh
        run: ctest --test-dir build/windows-qt6-pr --output-on-failure --verbose
